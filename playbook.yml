- name: Run api tests
  hosts: localhost
  tasks:
    - name: Pull test image
      community.docker.docker_image:
        name: "localhost:5005/{{ branch }}"
        tag: latest
        source: pull

    - name: Run tests
      community.docker.docker_container:
        name: "{{ branch }}-tests"
        image: "localhost:5005/{{ branch }}:latest"
        detach: false
        auto_remove: true