- name: Run api tests
  hosts: localhost
  tasks:
    - name: Pull test image
      community.docker.docker_image:
        name: "localhost:5005/{{ branch }}"
        tag: latest
        source: pull

    - name: Get current workdir
      ansible.builtin.command: pwd
      register: pwd_result

    - name: Debug pwd
      ansible.builtin.debug:
        msg: "pwd is: {{ pwd_result.stdout }}"

    - name: Allure results exist
      ansible.builtin.file:
        path: "{{ pwd_result.stdout }}/allure-results"
        state: directory
        mode: '0755'

    - name: Run tests
      ignore_errors: true
      community.docker.docker_container:
        name: "{{ branch }}-tests"
        image: "localhost:5005/{{ branch }}:latest"
        state: started
        network_mode: host
        mounts:
          - type: bind
            source: "/var/run/docker.sock"
            target: "/var/run/docker.sock"
          - type: bind
            source: "/etc/jenkins/jenkins_home{{ pwd_result.stdout }}/allure-results"
            target: "/allure/target/allure-results"
        detach: false